agent_paths = [
    ".vibe/agents",
]
enabled_agents = [
    "default",
    "plan",
    "codestral-coder",
    "code-reviewer",
    "test-writer",
    "doc-writer",
]
skill_paths = [
    ".vibe/skills",
]
enabled_skills = [
    "vibe",
    "agent-coordinator",
    "yaml-dsl",
    "codebase-memory",
    "codemod-mcp",
]
default_agent = "default"
active_model = "devstral-small"

[tools.write_file]
permission = "ask"

[tools.edit]
permission = "ask"

[[mcp_servers]]
name = "codebase-memory-mcp"
transport = "stdio"
command = "/home/ikusa/.local/bin/codebase-memory-mcp"
disabled = false
disabled_tools = []

[[mcp_servers]]
name = "dart-mcp"
transport = "stdio"
command = "dart mcp-server"

[[mcp_servers]]
name = "codemod-mcp"
transport = "stdio"
command = "cargo"
args = [
    "run",
    "-q",
    "--manifest-path",
    "rust/Cargo.toml",
    "-p",
    "codemod_recipe_host",
    "--bin",
    "codemod_mcp",
    "--",
    "--workspace-root",
    ".",
]
disabled = false
disabled_tools = []

[[models]]
name = "mistral-vibe-cli-latest"
provider = "mistral"
alias = "mistral-medium-3.5"
temperature = 1.0
input_price = 1.5
output_price = 7.5
cached_input_price = 0.15
thinking = "medium"
supports_images = true
auto_compact_threshold = 200000

[[models]]
name = "devstral-small-latest"
provider = "mistral"
alias = "devstral-small"
temperature = 0.2
input_price = 0.1
output_price = 0.3
cached_input_price = 0.01
thinking = "medium"
supports_images = false
auto_compact_threshold = 200000
