agent_paths = [
    ".vibe/agents",
]
enabled_agents = [
    "default",
    "plan",
    "codestral-coder",
    "code-reviewer",
    "test-writer",
    "doc-writer",
]
skill_paths = [
    ".vibe/skills",
]
enabled_skills = [
    "vibe",
    "agent-coordinator",
    "yaml-dsl",
    "codebase-memory",
    "codemod-mcp",
]
default_agent = "default"
active_model = "devstral-small"

[tools.write_file]
permission = "ask"

[tools.edit]
permission = "ask"

[[mcp_servers]]
name = "codebase-memory-mcp"
transport = "stdio"
command = "/home/ikusa/.local/bin/codebase-memory-mcp"
disabled = false
disabled_tools = []

[[mcp_servers]]
name = "dart-mcp"
transport = "stdio"
command = "dart mcp-server"

[[mcp_servers]]
name = "codemod-mcp"
transport = "stdio"
command = "cargo"
args = ["run", "-q", "--manifest-path", "rust/Cargo.toml", "-p", "codemod_recipe_host", "--bin", "codemod_mcp", "--", "--workspace-root", "."]
disabled = false
disabled_tools = []
