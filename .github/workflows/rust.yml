name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        working-directory: rust
        run: cargo test --all

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
