name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check with warnings as errors
        working-directory: rust
        run: RUSTFLAGS="-D warnings" cargo check --tests

      - name: Run tests
        working-directory: rust
        run: cargo test --all

      - name: Check generated host API surface is up-to-date
        working-directory: rust
        run: |
          export CARGO_TARGET_DIR="$PWD/target"
          cargo run -p codemod_recipe_host --bin generate_host_api_surface
          git diff --exit-code -- ../vscode_extension/stubs/codemod-context.d.luau ../vscode_extension/src/extension/language/hostApiSurface.ts

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --check

      - name: Check for unused dependencies
        working-directory: rust
        run: cargo install cargo-machete && cargo machete
