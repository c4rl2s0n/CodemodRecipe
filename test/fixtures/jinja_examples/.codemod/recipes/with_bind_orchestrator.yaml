id: jinja.bind.orchestrator
name: with_bind_orchestrator
description: |
  Forwards featureName → className and hardcodes suffix via recipe with bindings.

args:
  - name: featureName
    required: true
    inputKind: symbol

steps:
  - recipe:
      id: jinja.bind.child
      with:
        className: "{{ featureName }}"
        suffix: "Widget"
