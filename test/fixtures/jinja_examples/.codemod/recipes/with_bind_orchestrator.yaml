dslVersion: 2
id: with_bind_orchestrator
name: with_bind_orchestrator
description: |
  Forwards featureName → className and hardcodes suffix via recipe with bindings.

args:
  - name: featureName
    required: true
    inputKind: symbol

steps:
  - recipe:
      id: with_bind_child
      with:
        className: "{{ featureName }}"
        suffix: "Widget"
