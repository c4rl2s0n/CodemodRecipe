id: jinja.bind.orchestrator_partial
name: with_partial_orchestrator
description: |
  Partial with: remaps className from featureName; suffix falls through from parent.

args:
  - name: featureName
    required: true
    inputKind: symbol
  - name: suffix
    required: true
    inputKind: text

steps:
  - recipe:
      id: jinja.bind.child
      with:
        className: "{{ featureName }}"
