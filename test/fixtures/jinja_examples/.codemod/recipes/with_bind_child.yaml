id: with_bind_child
name: with_bind_child
description: Child recipe for call-site with bindings (className + suffix)

args:
  - name: className
    required: true
    inputKind: symbol
  - name: suffix
    required: true
    inputKind: text

steps:
  - create:
      path: "lib/generated/{{ className | snake_case }}_{{ suffix }}.dart"
      template: |
        class {{ className | pascal_case }}{{ suffix | pascal_case }} {}
      ifExists: fail
