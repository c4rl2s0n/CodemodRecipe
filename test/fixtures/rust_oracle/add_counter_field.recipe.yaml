id: add_counter_field
name: add_counter_field
description: Adds a field to a class

args:
  - name: file
    required: true
    inputKind: file
  - name: className
    required: true
    inputKind: symbol
  - name: field
    required: true
    inputKind: symbol

steps:
  - edit:
      path: "{{file}}"
      ops:
        - insert:
            query: |
              (class_definition
                name: (identifier) @className
                body: (class_body
                  (method_signature
                    (function_signature
                      name: (identifier) @methodName)) @member)
                (#eq? @className "{{className}}")
                (#eq? @methodName "update"))
            capture: member
            anchor: start
            text: "  final int {{ field | camel_case }};\n\n"

postExecution:
  - dartFormat
