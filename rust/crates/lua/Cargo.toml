[package]
name = "codemod_recipe_lua"
version = "0.1.0"
edition = "2021"

[dependencies]
codemod_recipe_lua_macros = { path = "../lua_macros" }
mlua = { version = "0.11", features = ["luau"] }
schemars = { version = "0.8", features = ["derive", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints]
workspace = true
