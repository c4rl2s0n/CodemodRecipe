[package]
name = "codemod_recipe_yaml"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[[bin]]
name = "codemod_dsl_codegen"
path = "src/bin/codemod_dsl_codegen.rs"

[dev-dependencies]
pretty_assertions = "1"

[lints]
workspace = true

