[package]
name = "codemod_recipe_components"
version = "0.1.0"
edition = "2021"
description = "Component scan/relations domain + ComponentHost facade (D-025 F)"

[dependencies]
codemod_recipe_core = { path = "../core" }
codemod_recipe_lua = { path = "../lua" }
