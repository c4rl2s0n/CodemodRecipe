[package]
name = "codemod_recipe_host"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "codemod_recipe_host"
path = "src/lib.rs"

[[bin]]
name = "codemod_host"
path = "src/bin/codemod_host.rs"

[[bin]]
name = "codemod_mcp"
path = "src/bin/codemod_mcp.rs"

[[bin]]
name = "generate_host_api_surface"
path = "src/bin/generate_host_api_surface.rs"

[dependencies]
codemod_recipe_core = { path = "../core" }
codemod_recipe_components = { path = "../components" }
codemod_recipe_engine = { path = "../engine" }
codemod_recipe_lua = { path = "../lua" }
codemod_recipe_lua_macros = { path = "../lua_macros" }
codemod_recipe_query_tools = { path = "../query_tools" }
linkme = "0.3"
mlua = { version = "0.11", features = ["luau"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
md5 = "0.7"
tree-sitter = "0.26"
minijinja = { version = "2", features = ["fuel", "loader"] }

[dev-dependencies]
pretty_assertions = "1"
tree-sitter = "0.26"
tree-sitter-language-pack = "1"

[lints]
workspace = true

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
