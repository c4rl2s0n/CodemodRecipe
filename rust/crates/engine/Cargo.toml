[package]
name = "codemod_recipe_engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["lang-pack", "lang-sqlite"]
lang-pack = ["dep:tree-sitter-language-pack"]
lang-sqlite = ["dep:tree-sitter-sqlite3"]
lang-postgres = ["dep:tree-sitter-postgres"]

[dependencies]
codemod_recipe_core = { path = "../core" }
thiserror = "2"
tree-sitter = "0.26"
tree-sitter-language-pack = { version = "1", optional = true }
tree-sitter-sqlite3 = { version = "0.1", optional = true }
tree-sitter-postgres = { version = "1.2", optional = true }

[dev-dependencies]
pretty_assertions = "1"

[lints]
workspace = true
