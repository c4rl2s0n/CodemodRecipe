[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/lua",
  "crates/lua_macros",
  "crates/engine",
  "crates/query_tools",
  "crates/components",
  "crates/host",
]

[workspace.lints.rust]
# `deny` (not `forbid`) so linkme `#[distributed_slice]` declarations can
# `#[allow(unsafe_code)]`. Linkme is a safe API, but its macro expands into
# this crate as `unsafe` / `#[unsafe(link_section)]`. See
# `crates/host/src/host_api/registry.rs` (`HOST_API_SURFACE`).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
